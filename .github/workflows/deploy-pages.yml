name: Deploy to GitHub Pages

# 推送到 main 时自动构建并发布；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，排队而不是互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查与构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        # 不在工作流里自动创建 Pages 站点：GITHUB_TOKEN 没有该权限，
        # 站点需在仓库 Settings → Pages 里一次性启用（Source: GitHub Actions）

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
